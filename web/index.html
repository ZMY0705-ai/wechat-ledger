<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记账 🐾</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 14 3.6 3.4 14 7.6Z' fill='%232563d9'/%3E%3Cpath d='M27 14 28.4 3.4 18 7.6Z' fill='%232563d9'/%3E%3Cellipse cx='16' cy='18.5' rx='11.4' ry='10.2' fill='%232563d9'/%3E%3Cellipse cx='11.6' cy='17.4' rx='2.9' ry='3.3' fill='%23ffffff'/%3E%3Cellipse cx='20.4' cy='17.4' rx='2.9' ry='3.3' fill='%23ffffff'/%3E%3Cellipse cx='11.6' cy='17.4' rx='1.4' ry='2.4' fill='%2311151a'/%3E%3Cellipse cx='20.4' cy='17.4' rx='1.4' ry='2.4' fill='%2311151a'/%3E%3Cellipse cx='16' cy='22.2' rx='1.3' ry='1' fill='%23f3b58f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mascot" id="mascot" aria-hidden="true">
      <svg viewBox="0 0 40 38">
        <path class="m-ear" d="M6.4 16.6 4.4 4 16.4 9.4Z"/>
        <path class="m-ear" d="M33.6 16.6 35.6 4 23.6 9.4Z"/>
        <path class="m-ear-in" d="M8.4 14.4 7.4 7.6 13.6 10.3Z"/>
        <path class="m-ear-in" d="M31.6 14.4 32.6 7.6 26.4 10.3Z"/>
        <ellipse class="m-head" cx="20" cy="22" rx="14.2" ry="12.6"/>
        <g class="m-eye">
          <ellipse class="m-sclera" cx="14.6" cy="20.6" rx="3.8" ry="4.3"/>
          <ellipse class="pupil" cx="14.6" cy="20.6" rx="2" ry="3.2"/>
        </g>
        <g class="m-eye">
          <ellipse class="m-sclera" cx="25.4" cy="20.6" rx="3.8" ry="4.3"/>
          <ellipse class="pupil" cx="25.4" cy="20.6" rx="2" ry="3.2"/>
        </g>
        <ellipse class="m-nose" cx="20" cy="25.1" rx="1.6" ry="1.2"/>
        <path class="m-mouth" d="M17.1 27.6q2.9 2.3 5.8 0"/>
      </svg>
    </span>
    <span>记账</span>
  </div>
  <div class="topbar-meta">
    <span id="today-label" class="muted"></span>
    <span id="live" class="live" title="实时连接状态">
      <span class="live-dot"></span><span id="live-text">连接中</span>
    </span>
    <span id="updated-at" class="muted"></span>
    <button id="refresh" class="ghost" type="button" title="重新拉取">刷新</button>
  </div>
</header>

<main>
  <section class="cards" id="balance-cards" aria-label="余额"></section>

  <section id="budget" aria-label="本月预算"></section>

  <section class="grid grid-2">
    <article class="card card-deco-left">
      <div class="card-head">
        <h2>每日支出</h2>
        <div class="seg" id="trend-range" role="group" aria-label="时间范围">
          <button type="button" data-days="14">14 天</button>
          <button type="button" data-days="30" class="on">30 天</button>
          <button type="button" data-days="90">90 天</button>
        </div>
      </div>
      <div id="line-chart" class="chart chart-line"></div>
    </article>

    <article class="card card-deco-right">
      <div class="card-head">
        <h2>本月支出构成</h2>
        <span class="muted" id="pie-total"></span>
      </div>
      <div class="pie-wrap">
        <div id="pie-chart" class="chart chart-pie"></div>
        <ul id="pie-legend" class="legend"></ul>
      </div>
    </article>
  </section>

  <section class="grid grid-3" id="summaries" aria-label="概况"></section>

  <section class="grid grid-2">
    <article class="card card-grow">
      <div class="card-head">
        <h2 id="tx-title">最近流水</h2>
        <div class="card-actions">
          <span class="muted" id="tx-count"></span>
          <button id="tx-clear-filter" class="ghost" type="button" hidden>清除筛选</button>
          <a class="link-btn" href="/api/export">导出 CSV</a>
        </div>
      </div>
      <div class="table-wrap">
        <table class="tx-table">
          <thead>
            <tr><th>日期</th><th>类型</th><th>分类</th><th>备注</th><th class="num">金额</th><th></th></tr>
          </thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
    </article>

    <article class="card card-form">
      <div class="card-head"><h2>记一笔</h2></div>
      <form id="quick-add" class="form" autocomplete="off">
        <div class="field">
          <label for="f-type">类型</label>
          <select id="f-type" name="type">
            <option value="expense">支出</option>
            <option value="income">收入</option>
            <option value="transfer">转账（现金流 → 长期储蓄）</option>
          </select>
        </div>

        <div class="field">
          <label for="f-amount">金额</label>
          <input id="f-amount" name="amount" inputmode="decimal" placeholder="35 或 35.5" required>
        </div>

        <div class="field" id="field-category">
          <label for="f-category">分类</label>
          <select id="f-category" name="category"></select>
        </div>

        <div class="field-row" id="field-transfer" hidden>
          <div class="field">
            <label for="f-from">转出</label>
            <select id="f-from" name="from"></select>
          </div>
          <div class="field">
            <label for="f-to">转入</label>
            <select id="f-to" name="to"></select>
          </div>
        </div>

        <div class="field">
          <label for="f-date">日期</label>
          <input id="f-date" name="date" type="date">
        </div>

        <div class="field">
          <label for="f-note">备注</label>
          <input id="f-note" name="note" placeholder="午饭">
        </div>

        <button type="submit" class="primary">记下来</button>
        <p class="hint">转账不计入收支，只改两边余额。日常记账走微信也行 🐾</p>
      </form>
    </article>
  </section>
</main>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="/app.js"></script>
<script type="module" src="/cat.js"></script>
</body>
</html>
